name: Sync Substack Posts

on:
  schedule:
    # Runs every 3 days at 8am UTC
    - cron: '0 8 */3 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout blog-posts repo
        uses: actions/checkout@v4
        with:
          repository: mcradcliffe2490/blog-posts
          token: ${{ secrets.BLOG_POSTS_TOKEN }}
          path: blog-posts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install rss-parser turndown

      - name: Sync Substack posts
        run: node .github/scripts/sync-substack.mjs
        env:
          SUBSTACK_FEED_URL: https://mcradcliffe.substack.com/feed

      - name: Commit and push new posts
        working-directory: blog-posts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new posts to sync"
          else
            git commit -m "Sync new posts from Substack"
            git push
          fi
